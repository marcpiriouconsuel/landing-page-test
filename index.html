<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Suivi des cours de bourse d'ETF en temps réel">
  <title>ETF Tracker - Suivi de cours</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-content">
      <h1 class="app-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
          <polyline points="16 7 22 7 22 13"></polyline>
        </svg>
        ETF Tracker
      </h1>
      <button class="btn-refresh" id="btn-refresh" aria-label="Rafraîchir les données" title="Rafraîchir">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-container">

    <!-- Add ETF Form -->
    <section class="add-section" aria-label="Ajouter un ETF">
      <h2>Ajouter un ETF</h2>
      <form class="add-form" id="add-form">
        <input
          type="text"
          id="etf-input"
          placeholder="ISIN ou symbole (ex: FR0013412012)"
          autocomplete="off"
          aria-label="Code ISIN ou symbole de l'ETF"
        >
        <button type="submit" class="btn-add" id="btn-add">Ajouter</button>
      </form>
    </section>

    <!-- Status Message -->
    <div class="status-message" id="status-message" role="alert"></div>

    <!-- ETF List -->
    <section id="etf-list" class="etf-list" aria-label="Liste des ETF suivis">
    </section>

    <!-- Last Update -->
    <div class="last-update" id="last-update"></div>
  </main>

  <script>
    (function () {
      'use strict';

      // ========================
      // Configuration
      // ========================
      const STORAGE_KEY = 'etf-tracker-watchlist';
      const CORS_PROXIES = [
        'https://api.allorigins.win/raw?url=',
        'https://corsproxy.io/?url='
      ];

      // Well-known ISIN-to-ticker mappings for common European ETFs
      const ISIN_TICKER_MAP = {
        'FR0013412012': { ticker: 'EWLD.PA', name: 'Amundi MSCI World UCITS ETF' },
        'FR0010315770': { ticker: 'CW8.PA', name: 'Amundi MSCI World UCITS ETF - EUR (C)' },
        'LU1681043599': { ticker: 'MWRD.PA', name: 'Amundi MSCI World UCITS ETF' },
        'IE00B4L5Y983': { ticker: 'IWDA.AS', name: 'iShares Core MSCI World UCITS ETF' },
        'IE00B5BMR087': { ticker: 'CSPX.L', name: 'iShares Core S&P 500 UCITS ETF' },
        'LU0392494562': { ticker: 'XDWD.DE', name: 'Xtrackers MSCI World UCITS ETF' },
        'IE00BKM4GZ66': { ticker: 'EIMI.L', name: 'iShares Core MSCI EM IMI UCITS ETF' },
        'FR0010959676': { ticker: 'PANX.PA', name: 'Amundi PEA Nasdaq-100 UCITS ETF' },
        'LU1681048804': { ticker: 'PAEEM.PA', name: 'Amundi PEA MSCI Emerging Markets UCITS ETF' },
        'FR0013412285': { ticker: 'PE500.PA', name: 'Amundi PEA S&P 500 UCITS ETF' },
        'LU1681046931': { ticker: 'PCEU.PA', name: 'Amundi PEA MSCI Europe UCITS ETF' }
      };

      // ========================
      // State
      // ========================
      let watchlist = loadWatchlist();

      // ========================
      // DOM Elements
      // ========================
      const etfListEl = document.getElementById('etf-list');
      const addFormEl = document.getElementById('add-form');
      const etfInputEl = document.getElementById('etf-input');
      const btnRefreshEl = document.getElementById('btn-refresh');
      const statusEl = document.getElementById('status-message');
      const lastUpdateEl = document.getElementById('last-update');

      // ========================
      // LocalStorage
      // ========================
      function loadWatchlist() {
        try {
          const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (Array.isArray(data) && data.length > 0) return data;
        } catch (e) { /* ignore */ }
        // Default: include the requested ETF
        return [
          { isin: 'FR0013412012', ticker: 'EWLD.PA', name: 'Amundi MSCI World UCITS ETF' }
        ];
      }

      function saveWatchlist() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(watchlist));
      }

      // ========================
      // Status Messages
      // ========================
      function showStatus(message, type) {
        statusEl.textContent = message;
        statusEl.className = 'status-message visible ' + type;
        clearTimeout(showStatus._timer);
        showStatus._timer = setTimeout(function () {
          statusEl.className = 'status-message';
        }, 5000);
      }

      // ========================
      // Fetch ETF Data via Yahoo Finance
      // ========================
      function buildYahooUrl(ticker) {
        return 'https://query1.finance.yahoo.com/v8/finance/chart/' +
          encodeURIComponent(ticker) +
          '?interval=1d&range=5d';
      }

      async function fetchWithProxy(url) {
        // Try direct first (works in some environments)
        for (let i = -1; i < CORS_PROXIES.length; i++) {
          try {
            const fetchUrl = i === -1 ? url : CORS_PROXIES[i] + encodeURIComponent(url);
            const response = await fetch(fetchUrl, { signal: AbortSignal.timeout(10000) });
            if (response.ok) {
              return await response.json();
            }
          } catch (e) {
            // Try next proxy
          }
        }
        return null;
      }

      async function fetchETFData(ticker) {
        const url = buildYahooUrl(ticker);
        const data = await fetchWithProxy(url);
        if (!data || !data.chart || !data.chart.result || data.chart.result.length === 0) {
          return null;
        }

        const result = data.chart.result[0];
        const meta = result.meta;
        const quotes = result.indicators.quote[0];
        const closes = quotes.close.filter(function (v) { return v !== null; });

        if (closes.length === 0) return null;

        const currentPrice = meta.regularMarketPrice || closes[closes.length - 1];
        const previousClose = meta.chartPreviousClose || (closes.length > 1 ? closes[closes.length - 2] : currentPrice);
        const change = currentPrice - previousClose;
        const changePercent = previousClose !== 0 ? (change / previousClose) * 100 : 0;

        const highs = quotes.high.filter(function (v) { return v !== null; });
        const lows = quotes.low.filter(function (v) { return v !== null; });

        return {
          price: currentPrice,
          previousClose: previousClose,
          change: change,
          changePercent: changePercent,
          currency: meta.currency || 'EUR',
          dayHigh: meta.regularMarketDayHigh || (highs.length > 0 ? Math.max.apply(null, highs) : null),
          dayLow: meta.regularMarketDayLow || (lows.length > 0 ? Math.min.apply(null, lows) : null),
          volume: meta.regularMarketVolume || 0,
          exchange: meta.exchangeName || ''
        };
      }

      // ========================
      // Resolve ISIN to Ticker
      // ========================
      function resolveISIN(input) {
        const upper = input.trim().toUpperCase();

        // Check the local map
        if (ISIN_TICKER_MAP[upper]) {
          return ISIN_TICKER_MAP[upper];
        }

        // If it looks like an ISIN (2 letters + 10 alphanumeric), we can't auto-resolve
        if (/^[A-Z]{2}[A-Z0-9]{10}$/.test(upper)) {
          return null; // Unknown ISIN
        }

        // Assume it's already a ticker symbol
        return { ticker: upper, name: upper };
      }

      // ========================
      // Render ETF Cards
      // ========================
      function formatNumber(num, decimals) {
        if (num == null || isNaN(num)) return '—';
        const d = decimals != null ? decimals : 2;
        return num.toLocaleString('fr-FR', {
          minimumFractionDigits: d,
          maximumFractionDigits: d
        });
      }

      function formatVolume(num) {
        if (!num) return '—';
        if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
        if (num >= 1000) return (num / 1000).toFixed(0) + 'K';
        return num.toString();
      }

      function createETFCard(etf, data) {
        const card = document.createElement('article');
        card.className = 'etf-card' + (data ? '' : ' loading');
        card.setAttribute('data-isin', etf.isin || '');
        card.setAttribute('data-ticker', etf.ticker);

        let changeClass = 'neutral';
        let changeSign = '';
        let changeArrow = '';
        if (data) {
          if (data.change > 0) { changeClass = 'positive'; changeSign = '+'; changeArrow = '▲ '; }
          else if (data.change < 0) { changeClass = 'negative'; changeArrow = '▼ '; }
        }

        card.innerHTML =
          '<div class="etf-card-header">' +
            '<div class="etf-name" title="' + escapeHTML(etf.name || etf.ticker) + '">' +
              escapeHTML(etf.name || etf.ticker) +
            '</div>' +
            '<button class="btn-remove" aria-label="Supprimer ' + escapeHTML(etf.name || etf.ticker) + '" data-ticker="' + escapeHTML(etf.ticker) + '">' +
              '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>' +
            '</button>' +
          '</div>' +
          '<div class="etf-meta">' +
            (etf.isin ? '<span class="etf-isin">' + escapeHTML(etf.isin) + '</span>' : '') +
            '<span class="etf-ticker">' + escapeHTML(etf.ticker) + '</span>' +
          '</div>' +
          '<div class="etf-price-row">' +
            '<span class="etf-price">' +
              (data ? formatNumber(data.price) : '—') +
              ' <span class="etf-currency">' + (data ? escapeHTML(data.currency) : '') + '</span>' +
            '</span>' +
            '<span class="etf-change ' + changeClass + '">' +
              (data ? changeArrow + changeSign + formatNumber(data.change) + ' (' + changeSign + formatNumber(data.changePercent) + '%)' : '—') +
            '</span>' +
          '</div>' +
          '<div class="etf-details">' +
            '<div class="etf-detail-item">' +
              '<span class="etf-detail-label">Clôt. préc.</span>' +
              '<span class="etf-detail-value">' + (data ? formatNumber(data.previousClose) : '—') + '</span>' +
            '</div>' +
            '<div class="etf-detail-item">' +
              '<span class="etf-detail-label">Plus haut</span>' +
              '<span class="etf-detail-value">' + (data ? formatNumber(data.dayHigh) : '—') + '</span>' +
            '</div>' +
            '<div class="etf-detail-item">' +
              '<span class="etf-detail-label">Plus bas</span>' +
              '<span class="etf-detail-value">' + (data ? formatNumber(data.dayLow) : '—') + '</span>' +
            '</div>' +
            '<div class="etf-detail-item">' +
              '<span class="etf-detail-label">Volume</span>' +
              '<span class="etf-detail-value">' + (data ? formatVolume(data.volume) : '—') + '</span>' +
            '</div>' +
          '</div>';

        return card;
      }

      function escapeHTML(str) {
        const div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
      }

      function renderEmptyState() {
        etfListEl.innerHTML =
          '<div class="empty-state">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
              '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>' +
              '<polyline points="16 7 22 7 22 13"></polyline>' +
            '</svg>' +
            '<p>Aucun ETF suivi pour le moment.<br>Ajoutez un ETF avec son code ISIN ou symbole.</p>' +
          '</div>';
      }

      // ========================
      // Refresh Data
      // ========================
      async function refreshAll() {
        if (watchlist.length === 0) {
          renderEmptyState();
          lastUpdateEl.textContent = '';
          return;
        }

        btnRefreshEl.classList.add('spinning');

        // Render placeholders
        etfListEl.innerHTML = '';
        watchlist.forEach(function (etf) {
          etfListEl.appendChild(createETFCard(etf, null));
        });

        // Fetch all in parallel
        const results = await Promise.all(
          watchlist.map(function (etf) {
            return fetchETFData(etf.ticker).catch(function () { return null; });
          })
        );

        // Re-render with data
        etfListEl.innerHTML = '';
        watchlist.forEach(function (etf, i) {
          etfListEl.appendChild(createETFCard(etf, results[i]));
        });

        // Attach remove handlers
        etfListEl.querySelectorAll('.btn-remove').forEach(function (btn) {
          btn.addEventListener('click', function () {
            removeETF(btn.getAttribute('data-ticker'));
          });
        });

        const now = new Date();
        lastUpdateEl.textContent = 'Dernière mise à jour : ' +
          now.toLocaleDateString('fr-FR') + ' à ' +
          now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

        btnRefreshEl.classList.remove('spinning');
      }

      // ========================
      // Add / Remove ETF
      // ========================
      function addETF(input) {
        const trimmed = input.trim();
        if (!trimmed) return;

        const resolved = resolveISIN(trimmed);
        if (!resolved) {
          showStatus(
            'ISIN non reconnu. Essayez d\'entrer directement le symbole boursier (ex: EWLD.PA, CW8.PA).',
            'error'
          );
          return;
        }

        // Check duplicate
        const exists = watchlist.some(function (e) {
          return e.ticker === resolved.ticker;
        });
        if (exists) {
          showStatus('Cet ETF est déjà dans votre liste.', 'info');
          return;
        }

        const entry = {
          isin: /^[A-Z]{2}[A-Z0-9]{10}$/.test(trimmed.toUpperCase()) ? trimmed.toUpperCase() : '',
          ticker: resolved.ticker,
          name: resolved.name
        };

        watchlist.push(entry);
        saveWatchlist();
        showStatus(escapeHTML(entry.name || entry.ticker) + ' ajouté à la liste.', 'success');
        etfInputEl.value = '';
        refreshAll();
      }

      function removeETF(ticker) {
        watchlist = watchlist.filter(function (e) { return e.ticker !== ticker; });
        saveWatchlist();
        showStatus('ETF supprimé.', 'info');
        refreshAll();
      }

      // ========================
      // Event Listeners
      // ========================
      addFormEl.addEventListener('submit', function (e) {
        e.preventDefault();
        addETF(etfInputEl.value);
      });

      btnRefreshEl.addEventListener('click', function () {
        refreshAll();
      });

      // ========================
      // Init
      // ========================
      refreshAll();

      // Auto-refresh every 5 minutes
      setInterval(refreshAll, 5 * 60 * 1000);
    })();
  </script>

</body>
</html>
