<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Balle au Prisonnier 🏐</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #0d0d1a;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas { display: block; }

        /* HUD overlay */
        #hud {
            position: fixed; inset: 0;
            pointer-events: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
        #scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 28px 0;
        }
        .team-hud {
            display: flex; flex-direction: column;
            align-items: center; gap: 2px;
        }
        .team-name {
            font-size: 11px; font-weight: 700;
            letter-spacing: 3px; opacity: 0.85;
        }
        .team-score-num {
            font-size: 38px; font-weight: 900; line-height: 1;
        }
        #rouge-hud .team-name, #rouge-hud .team-score-num { color: #ff4757; }
        #bleu-hud .team-name,  #bleu-hud .team-score-num  { color: #54a0ff; }
        #center-hud {
            display: flex; flex-direction: column;
            align-items: center; padding-top: 6px; gap: 4px;
        }
        #game-title {
            font-size: 12px; font-weight: 700;
            color: rgba(255,255,255,0.35); letter-spacing: 2px;
        }

        /* Portrait warning */
        #rotate-msg {
            position: fixed; inset: 0;
            background: #0d0d1a;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            color: white; font-family: -apple-system, sans-serif;
            font-size: 20px; font-weight: 600;
            text-align: center; gap: 20px; z-index: 200;
        }
        #rotate-msg.visible { display: flex; }
        #rotate-icon { font-size: 56px; }

        /* Winner overlay */
        #winner-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.72);
            backdrop-filter: blur(6px);
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100; pointer-events: all; gap: 20px;
        }
        #winner-overlay.visible { display: flex; }
        #winner-label {
            font-family: -apple-system, sans-serif;
            font-size: 13px; font-weight: 700;
            color: rgba(255,255,255,0.55); letter-spacing: 4px;
        }
        #winner-name {
            font-family: -apple-system, sans-serif;
            font-size: 72px; font-weight: 900; line-height: 1;
        }
        #winner-name.rouge { color: #ff4757; text-shadow: 0 0 50px rgba(255,71,87,0.6); }
        #winner-name.bleu  { color: #54a0ff; text-shadow: 0 0 50px rgba(84,160,255,0.6); }
        #winner-sub {
            font-family: -apple-system, sans-serif;
            font-size: 20px; color: rgba(255,255,255,0.75); font-weight: 600;
        }
        #next-btn {
            padding: 15px 48px; border: none; border-radius: 50px;
            font-size: 17px; font-weight: 700;
            background: white; color: #0d0d1a;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(255,255,255,0.2);
            pointer-events: all;
            transition: transform 0.1s;
        }
        #next-btn:active { transform: scale(0.95); }

        /* Hint bar */
        #hint {
            position: fixed; bottom: 14px; left: 50%;
            transform: translateX(-50%);
            font-family: -apple-system, sans-serif;
            font-size: 12px; color: rgba(255,255,255,0.3);
            pointer-events: none; white-space: nowrap;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div id="scoreboard">
            <div class="team-hud" id="rouge-hud">
                <div class="team-name">ROUGE</div>
                <div class="team-score-num" id="rouge-score">0</div>
            </div>
            <div id="center-hud">
                <div id="game-title">BALLE AU PRISONNIER</div>
            </div>
            <div class="team-hud" id="bleu-hud">
                <div class="team-name">BLEU</div>
                <div class="team-score-num" id="bleu-score">0</div>
            </div>
        </div>
    </div>

    <div id="rotate-msg">
        <span id="rotate-icon">📱</span>
        <span>Tournez l'écran en mode paysage</span>
        <span style="font-size:14px;opacity:.6">Landscape mode recommended</span>
    </div>

    <div id="winner-overlay">
        <div id="winner-label">VICTOIRE !</div>
        <div id="winner-name"></div>
        <div id="winner-sub">remporte la manche</div>
        <button id="next-btn" onclick="nextRound()">🔄 Manche suivante</button>
    </div>

    <div id="hint">Glissez vos joueurs · Lancez la balle d'un geste rapide</div>

    <script>
    // ==============================================================
    //  BALLE AU PRISONNIER — Jeu multijoueur tactile
    // ==============================================================

    const canvas = document.getElementById('gameCanvas');
    const ctx    = canvas.getContext('2d');

    // --- Teams ---
    const ROUGE = 'rouge';
    const BLEU  = 'bleu';
    const TEAM_COLOR = { rouge: '#ff4757', bleu: '#54a0ff' };
    const TEAM_LIGHT = { rouge: '#ff6b81', bleu: '#74b9ff' };
    const TEAM_ZONE_FILL   = { rouge: 'rgba(255,71,87,0.06)',  bleu: 'rgba(84,160,255,0.06)' };
    const PRISON_FILL      = { rouge: 'rgba(255,71,87,0.14)',  bleu: 'rgba(84,160,255,0.14)' };
    const PRISON_BORDER    = { rouge: 'rgba(255,71,87,0.5)',   bleu: 'rgba(84,160,255,0.5)' };
    const PLAYERS_PER_TEAM = 3;
    const PRISON_FRAC      = 0.12; // fraction of width per prison strip
    const PORTRAIT_THRESHOLD    = 1.15;  // height/width ratio above which we show rotate message
    const TOUCH_RADIUS_MULT     = 3;     // max touch distance = PR * this for player selection
    const FRAME_TIME_MS         = 16.67; // assumed frame duration for velocity normalisation
    const MIN_THROW_SPEED       = 2.5;   // px/frame minimum flick velocity to throw the ball
    const MIN_ARROW_SPEED       = 1.5;   // px/frame minimum velocity to draw throw arrow
    const ARROW_SPEED_MULT      = 8;     // scales flick velocity to arrow length
    const MAX_ARROW_LENGTH      = 70;    // maximum throw arrow length in pixels

    // --- Dynamic constants ---
    let W, H, PR, BR, zones, BALL_SPEED;

    // --- Game state ---
    let players      = [];
    let ball         = {};
    let activeTouches = {}; // pointerId → { playerId, prevX, prevY, velX, velY, prevTime }
    let scores       = { rouge: 0, bleu: 0 };
    let phase        = 'playing'; // 'playing' | 'roundOver'

    // ==============================================================
    //  Setup & resize
    // ==============================================================
    function computeLayout() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
        PR = Math.min(W, H) * 0.055;
        BR = PR * 0.58;
        BALL_SPEED = Math.min(W, H) * 0.011;
        const pW = W * PRISON_FRAC;
        zones = {
            prisonBleu:  { x1: 0,       x2: pW        },
            rouge:       { x1: pW,      x2: W * 0.5   },
            bleu:        { x1: W * 0.5, x2: W - pW    },
            prisonRouge: { x1: W - pW,  x2: W         },
        };
    }

    function checkOrientation() {
        const portrait = window.innerHeight > window.innerWidth * PORTRAIT_THRESHOLD;
        document.getElementById('rotate-msg').classList.toggle('visible', portrait);
    }

    window.addEventListener('resize', () => {
        computeLayout();
        checkOrientation();
        repositionPlayers();
    });

    // ==============================================================
    //  Round init
    // ==============================================================
    function initRound() {
        computeLayout();
        checkOrientation();
        phase = 'playing';
        activeTouches = {};
        document.getElementById('winner-overlay').classList.remove('visible');

        const rCx = (zones.rouge.x1 + zones.rouge.x2) / 2;
        const bCx = (zones.bleu.x1  + zones.bleu.x2)  / 2;

        players = [];
        for (let i = 0; i < PLAYERS_PER_TEAM; i++) {
            const y = H * (0.25 + i * 0.25);
            players.push({
                id: i,
                team: ROUGE,
                x: rCx - PR, y,
                hasBall: false, inPrison: false, hitFlash: 0,
            });
            players.push({
                id: PLAYERS_PER_TEAM + i,
                team: BLEU,
                x: bCx + PR, y,
                hasBall: false, inPrison: false, hitFlash: 0,
            });
        }

        // Rouge middle player (id=1) starts with the ball
        const starter = players.find(p => p.team === ROUGE && p.id === 1);
        starter.hasBall = true;
        ball = {
            x: starter.x, y: starter.y,
            vx: 0, vy: 0,
            ownerId: starter.id,
            thrownBy: ROUGE,
        };
    }

    function repositionPlayers() {
        // Gently re-center players after resize without resetting prison state
        const rCx = (zones.rouge.x1 + zones.rouge.x2) / 2;
        const bCx = (zones.bleu.x1  + zones.bleu.x2)  / 2;
        players.forEach((p, idx) => {
            if (!p.inPrison) {
                p.x = p.team === ROUGE ? rCx - PR : bCx + PR;
                p.y = H * (0.25 + Math.floor(idx / 2) * 0.25);
            }
        });
        if (ball.ownerId >= 0) {
            const owner = players.find(p => p.id === ball.ownerId);
            if (owner) { ball.x = owner.x; ball.y = owner.y; }
        }
    }

    function nextRound() {
        initRound();
    }

    // ==============================================================
    //  Touch / Pointer events
    // ==============================================================
    canvas.addEventListener('pointerdown',   onDown,   { passive: false });
    canvas.addEventListener('pointermove',   onMove,   { passive: false });
    canvas.addEventListener('pointerup',     onUp,     { passive: false });
    canvas.addEventListener('pointercancel', onUp,     { passive: false });

    function nearestActivePlayerForTouch(x, y, team) {
        let best = null, bestD = PR * TOUCH_RADIUS_MULT;
        for (const p of players) {
            if (p.team !== team) continue;
            const d = Math.hypot(p.x - x, p.y - y);
            if (d < bestD) { bestD = d; best = p; }
        }
        return best;
    }

    function onDown(e) {
        e.preventDefault();
        if (phase !== 'playing') return;
        const tx = e.clientX, ty = e.clientY;

        // Determine team from touch position (natural split)
        const team = tx < W * 0.5 ? ROUGE : BLEU;
        const p = nearestActivePlayerForTouch(tx, ty, team);
        if (!p) return;

        canvas.setPointerCapture(e.pointerId);
        activeTouches[e.pointerId] = {
            playerId: p.id,
            prevX: tx, prevY: ty,
            velX: 0, velY: 0,
            prevTime: performance.now(),
        };
    }

    function onMove(e) {
        e.preventDefault();
        const t = activeTouches[e.pointerId];
        if (!t || phase !== 'playing') return;

        const x = e.clientX, y = e.clientY;
        const now = performance.now();
        const dt = Math.max(1, now - t.prevTime);

        t.velX = (x - t.prevX) / dt * FRAME_TIME_MS; // scale to ~px/frame @60fps
        t.velY = (y - t.prevY) / dt * FRAME_TIME_MS;
        t.prevX = x; t.prevY = y; t.prevTime = now;

        const player = players.find(p => p.id === t.playerId);
        if (!player) return;

        // Move player, clamped to their zone
        const zone = player.inPrison ? prisonZone(player.team) : activeZone(player.team);
        player.x = clamp(x, zone.x1 + PR, zone.x2 - PR);
        player.y = clamp(y, PR, H - PR);

        if (player.hasBall) { ball.x = player.x; ball.y = player.y; }
    }

    function onUp(e) {
        e.preventDefault();
        const t = activeTouches[e.pointerId];
        if (!t) return;
        delete activeTouches[e.pointerId];

        if (phase !== 'playing') return;
        const player = players.find(p => p.id === t.playerId);
        if (!player || !player.hasBall) return;

        const speed = Math.hypot(t.velX, t.velY);
        if (speed > MIN_THROW_SPEED) {
            // Throw!
            const scale = BALL_SPEED / speed;
            ball.vx = t.velX * scale;
            ball.vy = t.velY * scale;
            ball.ownerId = -1;
            ball.thrownBy = player.team;
            player.hasBall = false;
        }
    }

    // ==============================================================
    //  Helpers
    // ==============================================================
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function activeZone(team) { return team === ROUGE ? zones.rouge : zones.bleu; }
    function prisonZone(team) { return team === ROUGE ? zones.prisonRouge : zones.prisonBleu; }

    // Slot position for a prisoner inside a prison zone
    function prisonSlotPos(team) {
        const pz = prisonZone(team);
        const cx = (pz.x1 + pz.x2) / 2;
        const prisoners = players.filter(p => p.team === team && p.inPrison);
        const slot = prisoners.length; // 0-based slot being assigned
        return { x: cx, y: H * (0.25 + slot * 0.25) };
    }

    // ==============================================================
    //  Game logic update
    // ==============================================================
    function update() {
        if (phase !== 'playing') return;

        // Move free ball
        if (ball.ownerId === -1) {
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Bounce top / bottom
            if (ball.y - BR < 0)   { ball.y = BR;     ball.vy =  Math.abs(ball.vy); }
            if (ball.y + BR > H)   { ball.y = H - BR; ball.vy = -Math.abs(ball.vy); }
            // Bounce left / right walls
            if (ball.x - BR < 0)   { ball.x = BR;     ball.vx =  Math.abs(ball.vx); }
            if (ball.x + BR > W)   { ball.x = W - BR; ball.vx = -Math.abs(ball.vx); }

            // Check liberation: ball enters a prison zone
            checkLiberationZone();

            // Collision with active players
            for (const p of players) {
                if (p.inPrison) continue;
                const dist = Math.hypot(ball.x - p.x, ball.y - p.y);
                if (dist < PR + BR) {
                    if (p.team !== ball.thrownBy) {
                        imprisonPlayer(p);
                    } else {
                        catchBall(p);
                    }
                    break;
                }
            }
        }

        // Fade hit flash
        players.forEach(p => { if (p.hitFlash > 0) p.hitFlash -= 0.05; });

        // Check win
        const rougeAlive = players.filter(p => p.team === ROUGE && !p.inPrison).length;
        const bleuAlive  = players.filter(p => p.team === BLEU  && !p.inPrison).length;
        if (rougeAlive === 0) endRound(BLEU);
        if (bleuAlive  === 0) endRound(ROUGE);
    }

    function checkLiberationZone() {
        // Ball enters Prison Rouge (far right) thrown by Rouge → free a rouge prisoner
        if (ball.x > zones.prisonRouge.x1 && ball.thrownBy === ROUGE) {
            const prisoner = players.find(p => p.team === ROUGE && p.inPrison);
            if (prisoner) { liberatePlayer(prisoner); return; }
        }
        // Ball enters Prison Bleu (far left) thrown by Bleu → free a bleu prisoner
        if (ball.x < zones.prisonBleu.x2 && ball.thrownBy === BLEU) {
            const prisoner = players.find(p => p.team === BLEU && p.inPrison);
            if (prisoner) { liberatePlayer(prisoner); return; }
        }
    }

    function imprisonPlayer(player) {
        const pos = prisonSlotPos(player.team);
        player.inPrison = true;
        player.hasBall  = false;
        player.hitFlash = 1;
        player.x = pos.x;
        player.y = pos.y;

        // Bounce ball away
        const dx = ball.x - player.x;
        const dy = ball.y - player.y;
        const mag = Math.hypot(dx, dy) || 1;
        ball.vx = (dx / mag) * BALL_SPEED;
        ball.vy = (dy / mag) * BALL_SPEED;
        // Push ball outside player radius
        ball.x = player.x + (dx / mag) * (PR + BR + 2);
        ball.y = player.y + (dy / mag) * (PR + BR + 2);
    }

    function liberatePlayer(player) {
        player.inPrison = false;
        const zone = activeZone(player.team);
        player.x = (zone.x1 + zone.x2) / 2;
        player.y = H * 0.5;
        catchBall(player);
    }

    function catchBall(player) {
        ball.ownerId = player.id;
        ball.vx = 0; ball.vy = 0;
        ball.x = player.x; ball.y = player.y;
        ball.thrownBy = player.team;
        player.hasBall = true;
    }

    function endRound(winner) {
        phase = 'roundOver';
        scores[winner]++;
        document.getElementById('rouge-score').textContent = scores.rouge;
        document.getElementById('bleu-score').textContent  = scores.bleu;
        const nameEl = document.getElementById('winner-name');
        nameEl.textContent = winner.toUpperCase();
        nameEl.className = winner;
        document.getElementById('winner-overlay').classList.add('visible');
    }

    // ==============================================================
    //  Rendering
    // ==============================================================
    function drawField() {
        // Background
        ctx.fillStyle = '#0d0d1a';
        ctx.fillRect(0, 0, W, H);

        // Zone fills
        fillZone(zones.rouge, TEAM_ZONE_FILL[ROUGE]);
        fillZone(zones.bleu,  TEAM_ZONE_FILL[BLEU]);
        fillZone(zones.prisonBleu,  PRISON_FILL[BLEU]);
        fillZone(zones.prisonRouge, PRISON_FILL[ROUGE]);

        // Prison borders
        strokeZone(zones.prisonBleu,  PRISON_BORDER[BLEU],  2);
        strokeZone(zones.prisonRouge, PRISON_BORDER[ROUGE], 2);

        // Prison labels
        drawLabel(zones.prisonBleu,  'PRISON',  TEAM_LIGHT[BLEU]);
        drawLabel(zones.prisonRouge, 'PRISON',  TEAM_LIGHT[ROUGE]);

        // Zone labels
        drawZoneLabel(zones.rouge, 'ROUGE', TEAM_COLOR[ROUGE]);
        drawZoneLabel(zones.bleu,  'BLEU',  TEAM_COLOR[BLEU]);

        // Zone dividers (dashed)
        ctx.save();
        ctx.setLineDash([6, 6]);
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        vline(zones.prisonBleu.x2);
        vline(zones.prisonRouge.x1);
        ctx.restore();

        // Centre line
        ctx.save();
        ctx.setLineDash([12, 10]);
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        vline(W * 0.5);
        ctx.restore();

        // Centre circle
        ctx.save();
        ctx.setLineDash([6, 8]);
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(W / 2, H / 2, H * 0.12, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    function fillZone(z, color) {
        ctx.fillStyle = color;
        ctx.fillRect(z.x1, 0, z.x2 - z.x1, H);
    }

    function strokeZone(z, color, lw) {
        ctx.strokeStyle = color;
        ctx.lineWidth = lw;
        ctx.strokeRect(z.x1, 0, z.x2 - z.x1, H);
    }

    function vline(x) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }

    function drawLabel(z, text, color) {
        const cx = (z.x1 + z.x2) / 2;
        ctx.save();
        ctx.font = `bold ${Math.max(9, Math.min(W, H) * 0.018)}px -apple-system, sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.55;
        ctx.fillText(text, cx, H / 2);
        ctx.restore();
    }

    function drawZoneLabel(z, text, color) {
        const cx = (z.x1 + z.x2) / 2;
        ctx.save();
        ctx.font = `900 ${Math.max(14, Math.min(W, H) * 0.032)}px -apple-system, sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.18;
        ctx.fillText(text, cx, 8);
        ctx.restore();
    }

    function drawPlayer(p) {
        const color = TEAM_COLOR[p.team];
        const light = TEAM_LIGHT[p.team];

        // Hit flash
        if (p.hitFlash > 0) {
            ctx.save();
            ctx.globalAlpha = p.hitFlash * 0.7;
            ctx.beginPath();
            ctx.arc(p.x, p.y, PR * 2.2, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.restore();
        }

        // Glow
        const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, PR * 2);
        grd.addColorStop(0, color + '50');
        grd.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(p.x, p.y, PR * 2, 0, Math.PI * 2);
        ctx.fillStyle = grd;
        ctx.fill();

        // Circle
        ctx.beginPath();
        ctx.arc(p.x, p.y, PR, 0, Math.PI * 2);
        if (p.inPrison) {
            ctx.fillStyle = color + '35';
            ctx.fill();
            ctx.save();
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;
            ctx.stroke();
            ctx.restore();
        } else {
            // Gradient fill
            const fg = ctx.createRadialGradient(p.x - PR * 0.25, p.y - PR * 0.25, 0, p.x, p.y, PR);
            fg.addColorStop(0, light);
            fg.addColorStop(1, color);
            ctx.fillStyle = fg;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.8)';
            ctx.lineWidth = 2.5;
            ctx.stroke();
        }

        // Icon / number
        ctx.save();
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        if (p.inPrison) {
            ctx.font = `${PR * 0.75}px sans-serif`;
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.85;
            ctx.fillText('🔒', p.x, p.y);
        } else {
            const num = (p.team === ROUGE ? p.id + 1 : p.id - PLAYERS_PER_TEAM + 1).toString();
            ctx.font = `bold ${PR * 0.6}px -apple-system, sans-serif`;
            ctx.fillStyle = 'white';
            ctx.fillText(num, p.x, p.y);
        }
        ctx.restore();

        // Ball-holder ring
        if (p.hasBall) {
            ctx.save();
            ctx.setLineDash([7, 4]);
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#FFD700';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(p.x, p.y, PR + 7, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    }

    function drawBall() {
        const x = ball.x, y = ball.y;

        // Outer glow
        const og = ctx.createRadialGradient(x, y, 0, x, y, BR * 3.5);
        og.addColorStop(0, 'rgba(255,215,0,0.35)');
        og.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(x, y, BR * 3.5, 0, Math.PI * 2);
        ctx.fillStyle = og;
        ctx.fill();

        // Ball body
        const bg = ctx.createRadialGradient(x - BR * 0.3, y - BR * 0.35, BR * 0.05, x, y, BR);
        bg.addColorStop(0, '#fffbe6');
        bg.addColorStop(0.45, '#FFD700');
        bg.addColorStop(1,    '#e67e22');
        ctx.beginPath();
        ctx.arc(x, y, BR, 0, Math.PI * 2);
        ctx.fillStyle = bg;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Seam lines
        ctx.save();
        ctx.strokeStyle = 'rgba(0,0,0,0.18)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y, BR * 0.6, 0.1, Math.PI - 0.1);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y, BR * 0.6, Math.PI + 0.1, -0.1);
        ctx.stroke();
        ctx.restore();
    }

    function drawThrowArrow() {
        for (const t of Object.values(activeTouches)) {
            const p = players.find(pl => pl.id === t.playerId);
            if (!p || !p.hasBall) continue;
            const speed = Math.hypot(t.velX, t.velY);
            if (speed < MIN_ARROW_SPEED) continue;
            const nx = t.velX / speed, ny = t.velY / speed;
            const len = Math.min(speed * ARROW_SPEED_MULT, MAX_ARROW_LENGTH);
            const sx = p.x + nx * (PR + BR + 4);
            const sy = p.y + ny * (PR + BR + 4);
            const ex = sx + nx * len;
            const ey = sy + ny * len;

            ctx.save();
            ctx.setLineDash([6, 5]);
            ctx.strokeStyle = 'rgba(255,215,0,0.7)';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(sx, sy); ctx.lineTo(ex, ey);
            ctx.stroke();
            // Arrowhead
            ctx.setLineDash([]);
            ctx.fillStyle = 'rgba(255,215,0,0.7)';
            ctx.beginPath();
            ctx.translate(ex, ey);
            ctx.rotate(Math.atan2(ny, nx));
            ctx.moveTo(0, 0); ctx.lineTo(-10, -5); ctx.lineTo(-10, 5);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
    }

    // ==============================================================
    //  Main loop
    // ==============================================================
    function loop() {
        update();
        ctx.clearRect(0, 0, W, H);
        drawField();
        players.forEach(drawPlayer);
        drawBall();
        drawThrowArrow();
        requestAnimationFrame(loop);
    }

    // ==============================================================
    //  Boot
    // ==============================================================
    initRound();
    loop();
    </script>
</body>
